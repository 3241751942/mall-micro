server:
  port: 8994
spring:
  main:
    allow-circular-references: true
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
    gateway:
      server:
        webflux:
          routes:
            # 1. 订单服务
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/api/admin/orders/**

            # 2. 商品服务
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/brands/**,/api/admin/products/**,/api/admin/categories/**,/api/admin/brands/**,

            # 3. 用户服务
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**,/api/addresses/**

            # 4. 购物车服务
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**

            # 5. 支付服务
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            # 6. 认证服务
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/internal/auth/**

            # 7. 通知服务
            - id: notify-service
              uri: lb://notify-service
              predicates:
                - Path=/api/notify/**

            # 8. 搜索服务
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**

            # 9. 日志服务（新增）
            - id: log-service
              uri: lb://log-service
              predicates:
                - Path=/api/logs/**

    sentinel:
      transport:
        dashboard: localhost:8858
      filter:
        enabled: true

# 白名单路径（不需要认证）
gateway:
  whitelist:
    - /api/auth/login
    - /api/auth/logout
    - /internal/auth//verify
    - /api/users/register
    - /api/products/page
    - /api/products/**
    - /api/categories/tree
    - /api/brands
    - /api/stocks/**