server:
  port: 9300

spring:
  application:
    name: product-service
  config:
    import: nacos:user-service.yml

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  datasource:
    password: 123456
    username: root
    url: jdbc:mysql://localhost:3306/product_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver


  cloud:
    nacos:
      config:
        namespace: public
        file-extension: yml
        server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        server-addr: 127.0.0.1:8848


mybatis-plus:
  mapper-locations:
    - classpath*:mapper/**/*.xml
  type-aliases-package:
    - com.zzl.productservice.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      logic-delete-field: deleted
